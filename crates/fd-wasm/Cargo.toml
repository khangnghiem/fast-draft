[package]
name = "fd-wasm"
description = "FD (Fast Draft) — WASM bridge for VS Code extension"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fd-core = { path = "../fd-core" }
fd-editor = { path = "../fd-editor" }
fd-render = { path = "../fd-render" }
wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
web-sys = { workspace = true, features = [
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "HtmlCanvasElement",
    "TextMetrics",
    "Performance",
    "Window",
    "console",
] }
js-sys = { workspace = true }
log = { workspace = true }
nucleo-matcher = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }

# wasm-opt -O2 (wasm-pack default) incorrectly strips Canvas2D draw
# calls as dead code. -O1 preserves all imported JS side-effects while
# still applying safe optimizations (size savings ~90% of -O2).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1", "--enable-bulk-memory", "--enable-reference-types"]
