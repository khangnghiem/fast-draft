[package]
name = "fd-desktop"
version = "0.1.0"
description = "Fast Draft — Design as Code desktop app"
authors = ["Khang Nghiêm"]
edition = "2021"
license = "MIT"

[lib]
name = "fd_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
