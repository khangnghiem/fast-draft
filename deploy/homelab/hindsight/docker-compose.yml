# Hindsight Self-Hosted Deployment for Beelink WSL
# PostgreSQL 18 + pgvector + Hindsight + TailScale
# Copy this entire directory to your Beelink WSL: ~/hindsight-deploy/

services:
  # PostgreSQL 18 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg18
    # NOTE: Using latest pg18 tag. Pin to specific digest for reproducibility:
    # image: pgvector/pgvector:pg18@sha256:...
    container_name: hindsight-postgres
    hostname: hindsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hindsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hindsight}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"  # Only bind to localhost, not public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hindsight} -d ${POSTGRES_DB:-hindsight}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hindsight-net
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=8MB
      - -c
      - max_connections=100
      - -c
      - log_min_messages=warning
      - -c
      - log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h

  # Hindsight API Server
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight-api
    hostname: hindsight-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER:-hindsight}:${POSTGRES_PASSWORD}@hindsight-postgres:5432/${POSTGRES_DB:-hindsight}
      HINDSIGHT_API_VECTOR_EXTENSION: ${HINDSIGHT_API_VECTOR_EXTENSION:-pgvector}
      
      # LLM Provider (from your .zshrc.secrets)
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER:?HINDSIGHT_API_LLM_PROVIDER must be set}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?HINDSIGHT_API_LLM_API_KEY must be set}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL:-gpt-4o-mini}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL:-}
      
      # API Configuration
      HINDSIGHT_API_PORT: 8888
      HINDSIGHT_API_WORKER_ID: hindsight-prod
      HINDSIGHT_API_LOG_LEVEL: ${HINDSIGHT_API_LOG_LEVEL:-info}
      
      # Features
      HINDSIGHT_API_FILE_STORAGE_BACKEND: ${HINDSIGHT_API_FILE_STORAGE_BACKEND:-native}
      HINDSIGHT_API_FILE_DELETE_AFTER_RETAIN: "true"
      HINDSIGHT_API_AUDIT_LOG_ENABLED: ${HINDSIGHT_API_AUDIT_LOG_ENABLED:-false}
      
      # Text Search
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: ${HINDSIGHT_API_TEXT_SEARCH_EXTENSION:-native}
      
      # Security
      HINDSIGHT_API_ADMIN_PASSWORD: ${HINDSIGHT_API_ADMIN_PASSWORD:-}
      
    ports:
      - "127.0.0.1:8888:8888"  # API / MCP endpoint
      - "127.0.0.1:9999:9999"  # Web UI (control plane)
    volumes:
      - hindsight_data:/home/hindsight/.pg0
      - ./config/hindsight-override.yml:/app/config/override.yml:ro
    networks:
      - hindsight-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # TailScale sidecar for secure network access
  # This makes Hindsight available only within your Tailnet
  tailscale:
    image: tailscale/tailscale:latest
    container_name: hindsight-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-hindsight-server}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set - get from https://login.tailscale.com/admin/settings/keys}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --advertise-tags=tag:hindsight ${TAILSCALE_EXTRA_ARGS:-}
      TS_ACCEPT_DNS: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    devices:
      - /dev/net/tun
    networks:
      - hindsight-net
    # Tailscale acts as the network gateway for other services
    # Services connect through TailScale's network

  # Optional: Nginx reverse proxy for cleaner URLs
  nginx:
    image: nginx:alpine
    container_name: hindsight-nginx
    restart: unless-stopped
    depends_on:
      - hindsight
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - hindsight-net
    profiles:
      - nginx  # Only start with: docker compose --profile nginx up -d

volumes:
  postgres_data:
    driver: local
  hindsight_data:
    driver: local
  tailscale_state:
    driver: local

networks:
  hindsight-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
