name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }},wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.platform }}
          workspaces: fd-desktop/src-tauri

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build crates/fd-wasm --target web --out-dir ../../site/wasm

      - name: Install frontend dependencies
        working-directory: fd-desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: fd-desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fast-draft-${{ matrix.rust_target }}
          path: |
            fd-desktop/src-tauri/target/release/bundle/**/*.dmg
            fd-desktop/src-tauri/target/release/bundle/**/*.app
            fd-desktop/src-tauri/target/release/bundle/**/*.AppImage
            fd-desktop/src-tauri/target/release/bundle/**/*.deb
            fd-desktop/src-tauri/target/release/bundle/**/*.msi
            fd-desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
