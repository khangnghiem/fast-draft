name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: run full CI before releasing anything ──────────────────
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  # ── Build fd-lsp binaries (3 targets) ───────────────────────────
  lsp:
    name: Build fd-lsp (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lsp-${{ matrix.target }}

      - name: Build fd-lsp
        run: cargo build --release -p fd-lsp --target ${{ matrix.target }}

      - name: Package binary
        run: |
          STEM="fd-lsp-${{ matrix.target }}"
          mkdir -p "$STEM"
          cp "target/${{ matrix.target }}/release/fd-lsp" "$STEM/"
          tar -czf "$STEM.tar.gz" "$STEM"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd-lsp-${{ matrix.target }}
          path: fd-lsp-${{ matrix.target }}.tar.gz

  # ── Publish VS Code extension ───────────────────────────────────
  extension:
    name: Publish VS Code Extension
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fd-vscode
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Package VSIX
        run: pnpm exec vsce package --no-dependencies

      - name: Publish to Marketplace
        run: pnpm exec vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd-vscode.vsix
          path: fd-vscode/*.vsix

  # ── Update Zed extension ────────────────────────────────────────
  zed:
    name: Update Zed Extension
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: fast-draft
          extension-path: extensions/fast-draft
          push-to: khangnghiem/extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

  # ── Create GitHub Release with LSP binaries ─────────────────────
  release:
    name: Create GitHub Release
    needs: lsp
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fd-lsp-aarch64-apple-darwin/fd-lsp-aarch64-apple-darwin.tar.gz
            fd-lsp-x86_64-apple-darwin/fd-lsp-x86_64-apple-darwin.tar.gz
            fd-lsp-x86_64-unknown-linux-gnu/fd-lsp-x86_64-unknown-linux-gnu.tar.gz
