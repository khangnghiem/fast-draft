name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Gate: run full CI before releasing anything ──────────────────
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format
        run: cargo fmt --all -- --check

  # ── Build fd-lsp binaries (3 targets) ───────────────────────────
  lsp:
    name: Build fd-lsp (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lsp-${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release -p fd-lsp -p fdraft --target ${{ matrix.target }}

      - name: Package fd-lsp
        run: |
          STEM="fd-lsp-${{ matrix.target }}"
          mkdir -p "$STEM"
          cp "target/${{ matrix.target }}/release/fd-lsp" "$STEM/"
          tar -czf "$STEM.tar.gz" "$STEM"

      - name: Package fdraft
        run: |
          STEM="fdraft-${{ matrix.target }}"
          mkdir -p "$STEM"
          cp "target/${{ matrix.target }}/release/fdraft" "$STEM/"
          tar -czf "$STEM.tar.gz" "$STEM"

      - name: Upload fd-lsp artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd-lsp-${{ matrix.target }}
          path: fd-lsp-${{ matrix.target }}.tar.gz

      - name: Upload fdraft artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdraft-${{ matrix.target }}
          path: fdraft-${{ matrix.target }}.tar.gz

  # ── Build desktop app (4 targets) ───────────────────────────────
  desktop:
    name: Build Desktop (${{ matrix.rust_target }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }},wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.platform }}
          workspaces: fd-desktop/src-tauri

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        run: wasm-pack build crates/fd-wasm --target web --out-dir ../../site/wasm

      - name: Install frontend dependencies
        working-directory: fd-desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: fd-desktop
          tauriScript: npx tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Fast Draft ${{ github.ref_name }}"
          releaseId: ""
          updaterJsonPreferNsis: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fast-draft-desktop-${{ matrix.rust_target }}
          path: |
            fd-desktop/src-tauri/target/**/release/bundle/**/*.dmg
            fd-desktop/src-tauri/target/**/release/bundle/**/*.app
            fd-desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            fd-desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz.sig
            fd-desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            fd-desktop/src-tauri/target/**/release/bundle/**/*.AppImage.sig
            fd-desktop/src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            fd-desktop/src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz.sig
            fd-desktop/src-tauri/target/**/release/bundle/**/*.deb
            fd-desktop/src-tauri/target/**/release/bundle/**/*.msi
            fd-desktop/src-tauri/target/**/release/bundle/**/*.msi.zip
            fd-desktop/src-tauri/target/**/release/bundle/**/*.msi.zip.sig
            fd-desktop/src-tauri/target/**/release/bundle/**/*.nsis.zip
            fd-desktop/src-tauri/target/**/release/bundle/**/*.nsis.zip.sig
            fd-desktop/src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: warn

      - name: Upload latest.json
        if: matrix.rust_target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: updater-latest-json
          path: latest.json
          if-no-files-found: warn

  # ── Publish VS Code extension ───────────────────────────────────
  extension:
    name: Publish VS Code Extension
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fd-vscode
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Package VSIX
        run: pnpm exec vsce package --no-dependencies

      - name: Publish to Marketplace
        run: pnpm exec vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd-vscode.vsix
          path: fd-vscode/*.vsix

  # ── Update Zed extension ────────────────────────────────────────
  zed:
    name: Update Zed Extension
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: fast-draft
          extension-path: extensions/fast-draft
          push-to: khangnghiem/extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}

  # ── Create GitHub Release with LSP binaries + desktop installers ─
  release:
    name: Create GitHub Release
    needs: [lsp, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fd-lsp-aarch64-apple-darwin/fd-lsp-aarch64-apple-darwin.tar.gz
            fd-lsp-x86_64-apple-darwin/fd-lsp-x86_64-apple-darwin.tar.gz
            fd-lsp-x86_64-unknown-linux-gnu/fd-lsp-x86_64-unknown-linux-gnu.tar.gz
            fdraft-aarch64-apple-darwin/fdraft-aarch64-apple-darwin.tar.gz
            fdraft-x86_64-apple-darwin/fdraft-x86_64-apple-darwin.tar.gz
            fdraft-x86_64-unknown-linux-gnu/fdraft-x86_64-unknown-linux-gnu.tar.gz
            fast-draft-desktop-aarch64-apple-darwin/**/*
            fast-draft-desktop-x86_64-apple-darwin/**/*
            fast-draft-desktop-x86_64-unknown-linux-gnu/**/*
            fast-draft-desktop-x86_64-pc-windows-msvc/**/*
            updater-latest-json/latest.json

