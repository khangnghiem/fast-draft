name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  npm_config_yes: "true"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build WASM + Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build crates/fd-wasm --target web --out-dir ../../site/wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build vendor bundle (CodeMirror + lz-string)
        run: |
          cd site
          npm ci
          npx esbuild vendor/cm-entry.js --bundle --format=esm --minify --outfile=vendor/cm.min.js

      - name: Create CF Pages project (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create fast-draft --production-branch=main
        continue-on-error: true  # OK if project already exists

      - name: Copy Pages Functions
        run: |
          if [ -d functions ]; then
            cp -r functions site/
            echo "Copied Pages Functions to site/"
          fi

      - name: Auto-bust cache (replace ?v=X.Y.Z with git SHA)
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          sed -i "s/?v=[0-9.]*/?v=$SHA/g" site/index.html
          sed -i "s/?v=[0-9.]*/?v=$SHA/g" site/app.js
          sed -i "s/?v=[0-9.]*/?v=$SHA/g" site/style.css
          echo "Cache-bust: ?v=$SHA"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=fast-draft --commit-dirty=true

      - name: Purge Cloudflare CDN cache
        if: success()
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | jq '.success'
