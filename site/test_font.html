<!DOCTYPE html>
<html>
<head>
    <style>
        textarea { padding:0; margin:0; border:1px solid red; }
    </style>
</head>
<body>
    <textarea id="t1">Text</textarea>
    <textarea id="t2">Text 2</textarea>
    <script>
        const t1 = document.getElementById('t1');
        t1.style.font = "400 21px/25.2px \"Times New Roman\""; // Quoted
        
        const t2 = document.getElementById('t2');
        t2.style.font = "400 21px/25.2px Inter"; // Unquoted

        console.log("t1 font:", t1.style.font, t1.style.cssText);
        console.log("t2 font:", t2.style.font, t2.style.cssText);
    </script>
</body>
</html>
